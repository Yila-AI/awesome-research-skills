name: Release versioned lean Skill

on:
  push:
    tags:
      - "science-research-writing-v*"
      - "sci-ssci-polishing-v*"
      - "research-presentation-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run repository tests
        run: python3 -m unittest discover -s tests -v

      - name: Build lean archive
        id: build
        shell: bash
        run: |
          skill_name="${GITHUB_REF_NAME%-v*}"
          release_version="${GITHUB_REF_NAME#${skill_name}-}"
          archive_path="$(python3 scripts/build_lean_release.py --skill "$skill_name" --version "$release_version" --output-dir dist)"
          checksum_path="${archive_path}.sha256"
          archive_dir="$(dirname "$archive_path")"
          archive_name="$(basename "$archive_path")"
          (cd "$archive_dir" && sha256sum "$archive_name") > "$checksum_path"
          echo "skill_name=$skill_name" >> "$GITHUB_OUTPUT"
          echo "archive_path=$archive_path" >> "$GITHUB_OUTPUT"
          echo "checksum_path=$checksum_path" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE_PATH: ${{ steps.build.outputs.archive_path }}
          CHECKSUM_PATH: ${{ steps.build.outputs.checksum_path }}
          SKILL_NAME: ${{ steps.build.outputs.skill_name }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$ARCHIVE_PATH" "$CHECKSUM_PATH" \
            --verify-tag \
            --title "$SKILL_NAME Lean $GITHUB_REF_NAME" \
            --generate-notes
