name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: [self-hosted, linux, x64, yila-skills-ci]
    timeout-minutes: 15
    env:
      UV_PYTHON_PREFERENCE: only-managed
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          enable-cache: false
          activate-environment: true
          no-project: true
          venv-path: ${{ runner.temp }}/skill-venv
          python-version: ${{ matrix.python-version }}

      - name: Run repository tests
        run: python -m unittest discover -s tests -v

      - name: Validate Skill packages
        run: python scripts/validate_skills.py

      - name: Check local Markdown links
        run: python scripts/check_markdown_links.py

      - name: Build every lean distribution
        run: |
          for skill in science-research-writing sci-ssci-polishing academic-humanizer research-presentation; do
            python scripts/build_lean_release.py \
              --skill "$skill" \
              --version v0.0.0-ci \
              --output-dir dist
          done
